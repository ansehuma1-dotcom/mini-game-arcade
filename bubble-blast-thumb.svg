<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="Bubble Blast thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0F7F4"/>
      <stop offset="1" stop-color="#FFF3D6"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.35" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- bubble cluster -->
  <g stroke="#000000" stroke-width="3">
    <circle cx="200" cy="52" r="26" fill="#FF90E8"/>
    <circle cx="148" cy="52" r="26" fill="#23A094"/>
    <circle cx="252" cy="52" r="26" fill="#FFC900"/>
    <circle cx="174" cy="96" r="26" fill="#8B5CF6"/>
    <circle cx="226" cy="96" r="26" fill="#FF90E8"/>
    <circle cx="122" cy="96" r="26" fill="#FFC900"/>
    <circle cx="278" cy="96" r="26" fill="#23A094"/>
    <circle cx="200" cy="140" r="26" fill="#FFC900"/>
    <circle cx="148" cy="140" r="26" fill="#FF90E8"/>
    <circle cx="252" cy="140" r="26" fill="#23A094"/>
  </g>
  <g fill="url(#shine)">
    <circle cx="200" cy="52" r="26"/><circle cx="148" cy="52" r="26"/><circle cx="252" cy="52" r="26"/>
    <circle cx="174" cy="96" r="26"/><circle cx="226" cy="96" r="26"/><circle cx="122" cy="96" r="26"/>
    <circle cx="278" cy="96" r="26"/><circle cx="200" cy="140" r="26"/><circle cx="148" cy="140" r="26"/>
    <circle cx="252" cy="140" r="26"/>
  </g>
  <!-- popping bubbles -->
  <g>
    <circle cx="118" cy="180" r="8" fill="#FF90E8" opacity="0.9"/>
    <circle cx="292" cy="178" r="6" fill="#23A094" opacity="0.9"/>
    <circle cx="262" cy="196" r="5" fill="#FFC900" opacity="0.9"/>
    <circle cx="140" cy="198" r="5" fill="#8B5CF6" opacity="0.9"/>
  </g>
  <!-- aim dots -->
  <g fill="#000000" opacity="0.55">
    <circle cx="206" cy="216" r="4"/><circle cx="212" cy="196" r="4"/><circle cx="218" cy="176" r="4"/>
  </g>
  <!-- cannon -->
  <g transform="translate(200 258) rotate(12)">
    <rect x="-11" y="-52" width="22" height="56" rx="6" fill="#374151" stroke="#000000" stroke-width="3"/>
    <circle cx="0" cy="0" r="26" fill="#FFC900" stroke="#000000" stroke-width="3"/>
    <circle cx="0" cy="0" r="15" fill="#FF90E8" stroke="#000000" stroke-width="3"/>
  </g>
  <text x="200" y="292" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#000000">BUBBLE BLAST</text>
</svg>
