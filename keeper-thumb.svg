<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#23A094"/>
  <rect x="0" y="300" width="400" height="100" fill="#7ec850"/>
  <rect x="0" y="300" width="400" height="8" fill="#fff" opacity="0.6"/>
  <!-- goal -->
  <rect x="60" y="60" width="280" height="180" fill="#ffffff" opacity="0.25" stroke="#fff" stroke-width="8"/>
  <g stroke="#fff" stroke-width="2" opacity="0.8">
    <line x1="107" y1="60" x2="107" y2="240"/><line x1="154" y1="60" x2="154" y2="240"/>
    <line x1="201" y1="60" x2="201" y2="240"/><line x1="248" y1="60" x2="248" y2="240"/>
    <line x1="295" y1="60" x2="295" y2="240"/>
    <line x1="60" y1="105" x2="340" y2="105"/><line x1="60" y1="150" x2="340" y2="150"/>
    <line x1="60" y1="195" x2="340" y2="195"/>
  </g>
  <!-- ball flying in -->
  <g>
    <circle cx="290" cy="120" r="26" fill="#fff" stroke="#000" stroke-width="4"/>
    <circle cx="290" cy="120" r="8" fill="#000"/>
    <path d="M290 94 L290 104 M272 128 L282 124 M308 128 L298 124" stroke="#000" stroke-width="3" fill="none"/>
    <path d="M330 100 l18 -8 M334 128 l20 2 M326 152 l16 10" stroke="#FFC900" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- keeper diving right -->
  <g transform="rotate(18 200 260)">
    <!-- legs -->
    <rect x="176" y="300" width="16" height="52" rx="6" fill="#000"/>
    <rect x="208" y="300" width="16" height="52" rx="6" fill="#000"/>
    <!-- body jersey -->
    <rect x="168" y="238" width="64" height="70" rx="12" fill="#FF90E8" stroke="#000" stroke-width="4"/>
    <!-- arms reaching up-right -->
    <rect x="222" y="180" width="18" height="72" rx="9" fill="#FF90E8" stroke="#000" stroke-width="4" transform="rotate(-38 231 216)"/>
    <rect x="150" y="176" width="18" height="66" rx="9" fill="#FF90E8" stroke="#000" stroke-width="4" transform="rotate(28 159 209)"/>
    <!-- gloves -->
    <circle cx="262" cy="168" r="22" fill="#FFC900" stroke="#000" stroke-width="4"/>
    <circle cx="138" cy="168" r="22" fill="#FFC900" stroke="#000" stroke-width="4"/>
    <circle cx="262" cy="168" r="9" fill="#fff" stroke="#000" stroke-width="3"/>
    <circle cx="138" cy="168" r="9" fill="#fff" stroke="#000" stroke-width="3"/>
    <!-- head -->
    <circle cx="200" cy="212" r="24" fill="#FFD9B3" stroke="#000" stroke-width="4"/>
    <circle cx="192" cy="210" r="3" fill="#000"/>
    <circle cx="208" cy="210" r="3" fill="#000"/>
    <path d="M192 222 Q200 228 208 222" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- headband -->
    <path d="M178 200 Q200 188 222 200" stroke="#23A094" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <!-- stars -->
  <g fill="#FFC900" stroke="#000" stroke-width="2">
    <path d="M60 330 l6 14 15 2 -11 10 3 15 -13 -8 -13 8 3 -15 -11 -10 15 -2 z"/>
    <path d="M340 330 l6 14 15 2 -11 10 3 15 -13 -8 -13 8 3 -15 -11 -10 15 -2 z"/>
  </g>
  <text x="200" y="392" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#fff" stroke="#000" stroke-width="1">GOAL KEEPER</text>
</svg>
