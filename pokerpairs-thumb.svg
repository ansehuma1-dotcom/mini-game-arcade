<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Poker Pairs game thumbnail">
  <rect width="400" height="400" fill="#14532d"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#166534" stroke-width="4" rx="16"/>
  <!-- face-down cards: 4 columns x 3 rows, 80x100, pitch 96 x 116 -->
  <g>
    <g fill="#991b1b" stroke="#fecaca" stroke-width="2">
      <rect x="24" y="16" width="80" height="100" rx="10"/>
      <rect x="120" y="16" width="80" height="100" rx="10"/>
      <rect x="216" y="16" width="80" height="100" rx="10"/>
      <rect x="312" y="16" width="80" height="100" rx="10"/>
      <rect x="24" y="132" width="80" height="100" rx="10"/>
      <rect x="312" y="132" width="80" height="100" rx="10"/>
      <rect x="24" y="248" width="80" height="100" rx="10"/>
      <rect x="120" y="248" width="80" height="100" rx="10"/>
      <rect x="216" y="248" width="80" height="100" rx="10"/>
      <rect x="312" y="248" width="80" height="100" rx="10"/>
    </g>
    <g fill="#fca5a5">
      <path d="M64 52 L76 66 L64 80 L52 66 Z"/>
      <path d="M160 52 L172 66 L160 80 L148 66 Z"/>
      <path d="M256 52 L268 66 L256 80 L244 66 Z"/>
      <path d="M352 52 L364 66 L352 80 L340 66 Z"/>
      <path d="M64 168 L76 182 L64 196 L52 182 Z"/>
      <path d="M352 168 L364 182 L352 196 L340 182 Z"/>
      <path d="M64 284 L76 298 L64 312 L52 298 Z"/>
      <path d="M160 284 L172 298 L160 312 L148 298 Z"/>
      <path d="M256 284 L268 298 L256 312 L244 298 Z"/>
      <path d="M352 284 L364 298 L352 312 L340 298 Z"/>
    </g>
  </g>
  <!-- two matching aces face up in the middle row -->
  <g>
    <rect x="120" y="132" width="80" height="100" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="132" y="162" font-family="sans-serif" font-size="26" font-weight="800" fill="#000000">A</text>
    <text x="160" y="206" text-anchor="middle" font-family="sans-serif" font-size="44" fill="#000000">♠</text>
    <text x="188" y="222" text-anchor="end" font-family="sans-serif" font-size="26" font-weight="800" fill="#000000">A</text>
    <rect x="216" y="132" width="80" height="100" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="228" y="162" font-family="sans-serif" font-size="26" font-weight="800" fill="#dc2626">A</text>
    <text x="256" y="206" text-anchor="middle" font-family="sans-serif" font-size="44" fill="#dc2626">♥</text>
    <text x="284" y="222" text-anchor="end" font-family="sans-serif" font-size="26" font-weight="800" fill="#dc2626">A</text>
  </g>
  <text x="200" y="382" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="800" fill="#FFC900">MATCH THE PAIRS!</text>
</svg>
