<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Rhythm Beat game thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <g stroke="rgba(148,163,184,0.35)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="320"/><line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
  </g>
  <g opacity="0.12">
    <rect x="0" y="0" width="100" height="320" fill="#ec4899"/>
    <rect x="100" y="0" width="100" height="320" fill="#f59e0b"/>
    <rect x="200" y="0" width="100" height="320" fill="#22c55e"/>
    <rect x="300" y="0" width="100" height="320" fill="#3b82f6"/>
  </g>
  <g font-family="sans-serif" font-weight="bold" text-anchor="middle">
    <circle cx="50" cy="70" r="26" fill="#ec4899" stroke="#fff" stroke-width="3"/>
    <text x="50" y="79" font-size="26" fill="#fff">♪</text>
    <circle cx="150" cy="140" r="26" fill="#f59e0b" stroke="#fff" stroke-width="3"/>
    <text x="150" y="149" font-size="26" fill="#fff">♪</text>
    <circle cx="250" cy="60" r="26" fill="#22c55e" stroke="#fff" stroke-width="3"/>
    <text x="250" y="69" font-size="26" fill="#fff">♪</text>
    <circle cx="350" cy="180" r="26" fill="#3b82f6" stroke="#fff" stroke-width="3"/>
    <text x="350" y="189" font-size="26" fill="#fff">♪</text>
    <circle cx="250" cy="235" r="30" fill="#22c55e" stroke="#fff" stroke-width="3"/>
    <text x="250" y="245" font-size="30" fill="#fff">♪</text>
  </g>
  <g>
    <line x1="0" y1="300" x2="400" y2="300" stroke="#fbbf24" stroke-width="10" opacity="0.35"/>
    <line x1="0" y1="300" x2="400" y2="300" stroke="url(#beam)" stroke-width="5"/>
  </g>
  <g font-family="sans-serif" font-weight="800" font-size="22" fill="#fff" text-anchor="middle">
