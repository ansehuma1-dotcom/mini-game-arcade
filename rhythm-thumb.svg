    <text x="150" y="345">F</text>
    <text x="250" y="345">J</text>
    <text x="350" y="345">K</text>
  </g>
  <text x="200" y="382" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="800" fill="#fbbf24">HIT THE BEAT!</text>
