<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Coin Collector game thumbnail">
  <rect width="400" height="300" fill="#fbcfe8"/>
  <circle cx="60" cy="52" r="22" fill="#fff"/>
  <circle cx="92" cy="44" r="16" fill="#fff"/>
  <circle cx="340" cy="40" r="18" fill="#fff"/>
  <circle cx="362" cy="52" r="12" fill="#fff"/>
  <!-- sun -->
  <circle cx="338" cy="46" r="24" fill="#FFC900" stroke="#f59e0b" stroke-width="3"/>
  <!-- falling coins -->
  <g stroke="#92400e" stroke-width="3">
    <circle cx="110" cy="70" r="20" fill="#fbbf24"/>
    <circle cx="290" cy="60" r="20" fill="#fbbf24"/>
    <circle cx="200" cy="40" r="20" fill="#FFC900"/>
    <circle cx="150" cy="120" r="16" fill="#fbbf24"/>
    <circle cx="255" cy="115" r="16" fill="#FFC900"/>
  </g>
  <g fill="#92400e" font-family="sans-serif" font-weight="bold" font-size="20" text-anchor="middle">
    <text x="110" y="77">$</text>
    <text x="290" y="67">$</text>
    <text x="200" y="47">$</text>
  </g>
  <g fill="#0f766e" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">
    <text x="150" y="126">◆</text>
    <text x="255" y="121">★</text>
  </g>
  <!-- motion dashes -->
  <g stroke="#23A094" stroke-width="4" stroke-linecap="round">
    <line x1="110" y1="100" x2="110" y2="116"/>
    <line x1="290" y1="90" x2="290" y2="106"/>
    <line x1="200" y1="70" x2="200" y2="86"/>
  </g>
  <!-- ground -->
  <rect x="0" y="238" width="400" height="62" fill="#86c06c"/>
  <rect x="0" y="238" width="400" height="8" fill="#65a34d"/>
  <!-- treasure chest -->
  <g>
    <!-- open lid -->
    <path d="M140 210 L158 168 L242 168 L260 210 Z" fill="#7c2d12" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
    <rect x="158" y="168" width="84" height="10" fill="#FFC900" stroke="#000" stroke-width="2"/>
    <!-- coins spilling out -->
    <circle cx="165" cy="205" r="13" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
    <circle cx="235" cy="205" r="13" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
    <circle cx="200" cy="200" r="13" fill="#FFC900" stroke="#92400e" stroke-width="2"/>
    <circle cx="185" cy="212" r="11" fill="#23A094" stroke="#0f766e" stroke-width="2"/>
    <circle cx="218" cy="212" r="11" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
    <!-- body -->
    <rect x="130" y="208" width="140" height="62" rx="6" fill="#92400e" stroke="#000" stroke-width="3"/>
    <rect x="142" y="208" width="10" height="62" fill="#FFC900"/>
    <rect x="248" y="208" width="10" height="62" fill="#FFC900"/>
    <rect x="188" y="222" width="24" height="22" rx="3" fill="#FFC900" stroke="#000" stroke-width="2"/>
    <circle cx="200" cy="233" r="4" fill="#000"/>
  </g>
  <!-- sparkles -->
  <g fill="#fff">
    <path d="M90 150 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
    <path d="M320 150 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
  </g>
</svg>
