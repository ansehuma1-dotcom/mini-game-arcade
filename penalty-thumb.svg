<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#2fa866"/>
  <rect y="0" width="400" height="80" fill="#1f7a4a"/>
  <rect y="160" width="400" height="80" fill="#1f7a4a"/>
  <rect y="320" width="400" height="80" fill="#1f7a4a"/>
  <!-- crowd dots -->
  <g fill="#FFC900"><circle cx="40" cy="30" r="8"/><circle cx="90" cy="55" r="8"/><circle cx="150" cy="28" r="8"/><circle cx="210" cy="55" r="8"/><circle cx="270" cy="30" r="8"/><circle cx="330" cy="55" r="8"/><circle cx="370" cy="28" r="8"/></g>
  <g fill="#FF90E8"><circle cx="65" cy="42" r="7"/><circle cx="120" cy="30" r="7"/><circle cx="180" cy="45" r="7"/><circle cx="240" cy="30" r="7"/><circle cx="300" cy="45" r="7"/><circle cx="355" cy="42" r="7"/></g>
  <!-- goal -->
  <rect x="90" y="120" width="220" height="130" fill="#ffffff" opacity="0.35" stroke="#000" stroke-width="3"/>
  <g stroke="#ffffff" stroke-width="2" opacity="0.7">
    <line x1="127" y1="120" x2="127" y2="250"/><line x1="164" y1="120" x2="164" y2="250"/><line x1="201" y1="120" x2="201" y2="250"/><line x1="238" y1="120" x2="238" y2="250"/><line x1="275" y1="120" x2="275" y2="250"/>
    <line x1="90" y1="152" x2="310" y2="152"/><line x1="90" y1="185" x2="310" y2="185"/><line x1="90" y1="217" x2="310" y2="217"/>
  </g>
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="90" y1="250" x2="90" y2="120"/><line x1="90" y1="120" x2="310" y2="120"/><line x1="310" y1="120" x2="310" y2="250"/>
  </g>
  <!-- diving keeper -->
  <g transform="translate(215 235) rotate(-38)">
    <line x1="-14" y1="6" x2="-24" y2="30" stroke="#000" stroke-width="8" stroke-linecap="round"/>
    <line x1="10" y1="8" x2="22" y2="30" stroke="#000" stroke-width="8" stroke-linecap="round"/>
    <rect x="-18" y="-26" width="36" height="36" rx="8" fill="#23A094" stroke="#000" stroke-width="3"/>
    <line x1="-16" y1="-16" x2="-40" y2="-30" stroke="#23A094" stroke-width="9" stroke-linecap="round"/>
    <line x1="16" y1="-16" x2="38" y2="-32" stroke="#23A094" stroke-width="9" stroke-linecap="round"/>
    <circle cx="-42" cy="-32" r="7" fill="#FFC900" stroke="#000" stroke-width="2"/>
    <circle cx="40" cy="-34" r="7" fill="#FFC900" stroke="#000" stroke-width="2"/>
    <circle cx="0" cy="-36" r="14" fill="#f2c89b" stroke="#000" stroke-width="3"/>
    <path d="M -14 -38 a 14 14 0 0 1 28 0 z" fill="#000"/>
  </g>
  <!-- football flying toward top corner -->
  <g transform="translate(318 138)">
    <circle r="26" fill="#ffffff" stroke="#000" stroke-width="4"/>
    <polygon points="0,-9 8,-3 5,7 -5,7 -8,-3" fill="#000"/>
    <circle cx="-17" cy="-12" r="4" fill="#000"/><circle cx="17" cy="-12" r="4" fill="#000"/><circle cx="0" cy="18" r="4" fill="#000"/>
  </g>
  <!-- motion lines -->
  <g stroke="#FFC900" stroke-width="5" stroke-linecap="round">
    <line x1="250" y1="180" x2="285" y2="158"/><line x1="240" y1="205" x2="272" y2="188"/><line x1="255" y1="225" x2="290" y2="212"/>
  </g>
  <!-- penalty spot ball -->
  <g transform="translate(200 330)">
    <circle r="22" fill="#ffffff" stroke="#000" stroke-width="4"/>
    <polygon points="0,-8 7,-2 4,6 -4,6 -7,-2" fill="#000"/>
    <circle cx="-14" cy="-10" r="3.5" fill="#000"/><circle cx="14" cy="-10" r="3.5" fill="#000"/><circle cx="0" cy="15" r="3.5" fill="#000"/>
  </g>
  <text x="200" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFC900" stroke="#000" stroke-width="1.5">PENALTY KICK</text>
</svg>
