      <path d="M200 200 L193 205 M200 200 L207 205"/>
      <path d="M200 208 L196 218 M200 208 L204 218"/>
    </g>
    <circle cx="200" cy="190" r="6" fill="#f59e0b"/>
  </g>
  <!-- birds -->
  <g stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M96 120 Q104 112 112 120 Q120 112 128 120"/>
    <path d="M288 60 Q295 53 302 60 Q309 53 316 60"/>
  </g>
