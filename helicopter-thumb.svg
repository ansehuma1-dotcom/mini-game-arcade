<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Helicopter Rescue game thumbnail">
  <rect width="400" height="300" fill="#7dd3fc"/>
  <circle cx="348" cy="42" r="24" fill="#fef08a"/>
  <g fill="rgba(255,255,255,0.9)">
    <ellipse cx="80" cy="52" rx="34" ry="13"/>
    <ellipse cx="210" cy="34" rx="28" ry="11"/>
    <ellipse cx="310" cy="86" rx="30" ry="12"/>
  </g>
  <!-- city skyline -->
  <g>
