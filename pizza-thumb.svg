<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#fde68a"/>
  <!-- brick oven wall -->
  <g fill="#fca5a5"><rect x="0" y="0" width="400" height="300"/></g>
  <g fill="#f87171">
    <rect x="0" y="30" width="400" height="6"/><rect x="0" y="90" width="400" height="6"/>
    <rect x="0" y="150" width="400" height="6"/><rect x="0" y="210" width="400" height="6"/>
    <rect x="0" y="270" width="400" height="6"/>
  </g>
  <!-- oven opening -->
  <rect x="55" y="55" width="290" height="200" rx="24" fill="#451a03"/>
  <rect x="68" y="68" width="264" height="174" rx="18" fill="#78350f"/>
  <!-- pizza -->
  <circle cx="200" cy="160" r="82" fill="#fbbf24"/>
  <circle cx="200" cy="160" r="68" fill="#ef4444"/>
  <circle cx="200" cy="160" r="58" fill="#fde68a"/>
  <circle cx="168" cy="138" r="11" fill="#dc2626"/>
  <circle cx="232" cy="132" r="11" fill="#dc2626"/>
  <circle cx="200" cy="172" r="11" fill="#dc2626"/>
  <circle cx="238" cy="186" r="9" fill="#1c1917"/>
  <circle cx="164" cy="182" r="9" fill="#1c1917"/>
  <circle cx="200" cy="128" r="8" fill="#22c55e"/>
  <circle cx="226" cy="158" r="8" fill="#f5f5f4"/>
  <circle cx="176" cy="158" r="7" fill="#ef4444"/>
  <!-- flames under the pizza -->
  <path d="M150 235 q8 -16 16 0 q8 -20 16 0 q8 -16 16 0 q8 -20 16 0 q8 -16 16 0 q8 -20 16 0 q8 -16 16 0 l0 12 -92 0 z" fill="#f97316"/>
  <!-- timer -->
  <circle cx="330" cy="52" r="30" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <line x1="330" y1="52" x2="330" y2="32" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <line x1="330" y1="52" x2="344" y2="58" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <circle cx="330" cy="52" r="4" fill="#000000"/>
  <!-- topping bowls -->
  <circle cx="70" cy="52" r="22" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="70" cy="52" r="9" fill="#dc2626"/>
  <circle cx="118" cy="52" r="22" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="118" cy="52" r="9" fill="#22c55e"/>
  <text x="200" y="288" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#7c2d12">PIZZA MAKER</text>
</svg>
